# ─────────────────────────────────────────────────────────────────────────────
# Cross-project boundary: the auditor does not cross it.
# ─────────────────────────────────────────────────────────────────────────────
cross_project_boundary:
  other_project: MidiGenPlay
  rule: >
    ALWTTT owns the game-side of the handoff. MidiGenPlay owns package
    internals. The auditor only audits ALWTTT. Any invariant whose
    verification would require reading or running MidiGenPlay code must
    be reported as "not verifiable from this side of the boundary" rather
    than cause a cross-project traversal.
  governed_here:
    - Docs/integrations/midigenplay/SSoT_ALWTTT_MidiGenPlay_Boundary.md
  not_governed_here:
    - "Package internals of MidiGenPlay (composer algorithms, bundle-field precedence, TS normalization, repository loading/selection, package-side authoring tools)."
